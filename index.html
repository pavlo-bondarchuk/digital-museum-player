:0;border-radius:22px 9px 9px 22px}.right{right:0;border-radius:9px 22px 22px 9px}.ok{left:33.33%;top:33.33%;width:33.34%;height:33.34%;border-radius:50%!important;background:var(--text)!important;color:var(--bg)!important;font-weight:900}.remote-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,400px);margin-top:26px}.remote-actions button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;cursor:pointer}@media(max-width:1000px){.catalog.active{grid-template-columns:190px minmax(0,1fr)}.person-photo{height:200px}}@media(max-width:760px){body{overflow:auto}.tv{padding:16px}.topbar{height:auto;align-items:flex-start}.brand-sub,.status,.time{display:none}.toolbar{flex-wrap:wrap;justify-content:flex-end}.idle{grid-template-columns:1fr}.idle-hero{min-height:420px;height:auto}.catalog.active{display:flex;flex-direction:column}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.grid,.people-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.item.article-layout.active{grid-template-columns:1fr}.article-panel,.item-image{max-height:none}.person-photo{height:260px}}

function applyTheme(){document.documentElement.dataset.theme=state.theme;document.querySelector('meta[name="theme-color"]').setAttribute('content',state.theme==='dark'?'#0a0a0b':'#f5f5f3');localStorage.setItem('dgu-theme',state.theme);if(window.lucide)lucide.createIcons()}function applyLanguage(){document.documentElement.lang=state.lang;localStorage.setItem('dgu-lang',state.lang);$('langUk').classList.toggle('active',state.lang==='uk');$('langEn').classList.toggle('active',state.lang==='en');$('brandSub').textContent=t().brandSub;$('idleEyebrow').textContent=t().idleEyebrow;$('idleTitle').textContent=t().idleTitle;$('idleText').textContent=t().idleText;$('pairTitle').textContent=t().pairTitle;$('pairText').textContent=t().pairText;$('sessionWord').textContent=t().session;$('sideFoot').textContent=state.lang==='uk'?'Дніпро_Гордість_України':'Dnipro_Pride_of_Ukraine';$('footerLeft').textContent=t().footer;$('footerState').textContent=state.screen==='idle'?t().screenReady:t().controlled;$('tvStatusText').textContent=$('tvStatus').classList.contains('online')?t().paired:t().waiting;$('remoteTitle').textContent=t().remoteTitle;$('remoteText').textContent=t().remoteText;$('remoteConnectedText').textContent=$('remoteConnected').classList.contains('online')?t().connected:t().searching;$('backBtn').textContent=t().back;$('homeBtn').textContent=t().home;if(mode==='tv'){state.selected=0;renderCatalog();hydrate()}}function renderNav(){$('nav').innerHTML=categories.map((c,i)=>`<button class="${i===state.category?'active':''} ${state.focus==='menu'&&i===state.category?'focused':''}" data-index="${i}"><i data-lucide="${c.icon}"></i>${t().categories[c.key].label}</button>`).join('')}function renderCatalog(){const c=currentCategory(),items=currentItems(),copy=t().categories[c.key],people=c.key==='people',hero=$('hero');hero.classList.toggle('no-image',people);let heroImg=c.img;if(c.key==='repertoire'&&items[state.selected])heroImg=items[state.selected].wide||items[state.selected].img||c.img;hero.style.backgroundImage=people?'none':`url('${heroImg||''}')`;$('heroEyebrow').textContent=copy.eyebrow;$('heroTitle').textContent=copy.hero;$('heroText').textContent=copy.text;$('sectionTitle').textContent=copy.label;renderNav();const total=Math.max(1,Math.ceil(items.length/4)),page=Math.min(total-1,Math.floor(state.selected/4)),start=page*4,visible=items.slice(start,start+4);$('pager').innerHTML=items.length>4?`<i data-lucide="chevron-left"></i><span>${page+1} / ${total}</span><i data-lucide="chevron-right"></i>`:'';const key=`${state.lang}:${c.key}`;$('apiState').textContent=state.apiStatus[key]==='live'?t().live:state.loading[key]?t().loading:t().fallback;$('grid').className=people?'grid people-grid':'grid';if(!visible.length){$('grid').innerHTML=`<div class="empty">${t().empty}</div>`}else if(people){$('grid').innerHTML=visible.map((x,j)=>{const idx=start+j;return`<article class="person-card ${state.focus==='grid'&&idx===state.selected?'selected':''}"><div class="person-photo"><img src="${x.img||''}" alt=""></div><div class="person-info"><strong>${x.title}</strong><span>${clean(x.content).slice(0,120)}</span></div></article>`}).join('')}else{$('grid').innerHTML=visible.map((x,j)=>{const idx=start+j;return`<article class="card ${state.focus==='grid'&&idx===state.selected?'selected':''}" style="--cover:url('${x.img||c.img||''}')"><div class="card-info"><small>${x.type||copy.label}</small><strong>${x.title}</strong><span>${x.meta||''}</span></div></article>`}).join('')}if(window.lucide)lucide.createIcons()}function setScreen(next){state.screen=next;$('idle').style.display=next==='idle'?'grid':'none';$('catalog').classList.toggle('active',next==='catalog');$('item').classList.toggle('active',next==='item');if(next==='catalog')renderCatalog();$('footerState').textContent=next==='idle'?t().screenReady:t().controlled;if(window.lucide)lucide.createIcons()}function move(cmd){if(state.focus==='menu'){if(cmd==='up')state.category=(state.category-1+categories.length)%categories.length;if(cmd==='down')state.category=(state.category+1)%categories.length;if(cmd==='right')state.focus='grid';state.selected=0;renderCatalog();return}const items=currentItems();if(cmd==='left'){if(state.selected%4===0)state.focus='menu';else state.selected--}if(cmd==='right')state.selected=Math.min(items.length-1,state.selected+1);if(cmd==='up')state.focus='menu';renderCatalog()}function openItem(){const x=currentItems()[state.selected],c=currentCategory();if(!x||c.key==='people')return;$('item').className='item article-layout active';$('itemEyebrow').textContent=x.type||t().categories[c.key].label;$('itemTitle').textContent=x.title;$('meta').innerHTML=x.meta?`<span>${x.meta}</span>`:'';$('articleBody').innerHTML=x.content||`<p>${t().empty}</p>`;$('infoFoot').textContent=t().readHint;$('itemImage').innerHTML=x.img?`<img src="${x.img}" alt="">`:'';state.screen='item';$('catalog').classList.remove('active');if(window.lucide)lucide.createIcons()}function command(cmd){if(state.screen==='idle'){if(cmd==='ok'||cmd==='home'){setPaired();setScreen('catalog')}return}if(state.screen==='item'){if(cmd==='back'||cmd==='left'){setScreen('catalog');return}if(cmd==='up'||cmd==='down'){$('articlePanel').scrollBy({top:cmd==='down'?180:-180,behavior:'smooth'});return}if(cmd==='ok'){const x=currentItems()[state.selected];if(x?.url)window.open(x.url,'_blank')}return}if(cmd==='home'){state.category=0;state.selected=0;state.focus='menu';renderCatalog();return}if(cmd==='back'){state.focus='menu';renderCatalog();return}if(state.focus==='menu'&&cmd==='ok'){state.focus='grid';renderCatalog();return}if(['left','right','up','down'].includes(cmd))move(cmd);if(cmd==='ok'&&state.focus==='grid')openItem()}function setPaired(){$('tvStatus').classList.add('online');$('tvStatusText').textContent=t().paired;$('footerState').textContent=t().controlled}function send(payload){const data=JSON.stringify({...payload,session});if(client&&client.connected)client.publish(topic,data);if(localChannel)localChannel.postMessage(data)}function handleMessage(raw){let data;try{data=typeof raw==='string'?JSON.parse(raw):raw}catch{return}if(data?.session!==session)return;if(mode==='tv'){if(data.type==='hello'){setPaired();if(state.screen==='idle')setScreen('catalog');send({type:'screen-online'})}if(data.type==='command'){if(state.screen==='idle')setScreen('catalog');command(data.command)}}else if(data.type==='screen-online'){remoteConfirmed=true;clearInterval(remoteHandshake);$('remoteConnected').classList.add('online');$('remoteConnectedText').textContent=t().connected}}function connectRealtime(){if('BroadcastChannel'in window){localChannel=new BroadcastChannel('digital-museum-'+session);localChannel.onmessage=e=>handleMessage(e.data)}if(window.mqtt){client=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{clientId:'dmp_'+mode+'_'+Math.random().toString(16).slice(2),reconnectPeriod:2000});client.on('connect',()=>client.subscribe(topic,()=>{if(mode==='remote')beginHandshake()}));client.on('message',(topicName,p)=>handleMessage(p.toString()))}}function beginHandshake(){clearInterval(remoteHandshake);const ping=()=>{if(!remoteConfirmed)send({type:'hello'})};ping();remoteHandshake=setInterval(ping,900)}function remoteUrl(){return 'https://pavlo-bondarchuk.github.io/digital-museum-player/?mode=remote&session='+session}function tickClock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString(state.lang==='uk'?'uk-UA':'en-GB',{hour:'2-digit',minute:'2-digit'});$('dateLabel').textContent=d.toLocaleDateString(state.lang==='uk'?'uk-UA':'en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase()}
$('langUk').onclick=()=>{if(state.lang!=='uk'){state.lang='uk';applyLanguage()}};$('langEn').onclick=()=>{if(state.lang!=='en'){state.lang='en';applyLanguage()}};$('themeToggle').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';applyTheme()};if(mode==='remote'){$('remoteView').classList.add('active');$('remoteSession').textContent=t().session+' '+session;document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send({type:'command',command:b.dataset.command}));connectRealtime();setTimeout(beginHandshake,500)}else{$('tvView').classList.add('active');$('sessionLabel').textContent=session;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&data='+encodeURIComponent(remoteUrl());setScreen('idle');connectRealtime();hydrate();tickClock();setInterval(tickClock,30000);addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'ok',Escape:'back'};if(map[e.key]){e.preventDefault();command(map[e.key])}})}applyTheme();applyLanguage();if(window.lucide)lucide.createIcons();
</script>
